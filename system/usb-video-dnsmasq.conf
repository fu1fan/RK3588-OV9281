# Dedicated point-to-point image link. No gateway or DNS changes on the Mac.
port=0
interface=vrusb0
bind-interfaces
dhcp-range=192.168.77.2,192.168.77.2,255.255.255.0,12h
dhcp-option=3
dhcp-option=6
dhcp-authoritative
pid-file=/var/run/usb-video-dnsmasq.pid
dhcp-leasefile=/var/run/usb-video-dnsmasq.leases
